name: CognitivePacingAtlasWatch
options:
  bundleIdPrefix: com.antonioflores
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true

packages:
  FirebaseSDK:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.0.0

targets:
  CognitivePacingAtlasWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: CognitivePacingAtlasWatch
        excludes:
          - "Info.plist"
    info:
      path: CognitivePacingAtlasWatch/Info.plist
      properties:
        CFBundleDisplayName: Pacing Atlas
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKWatchOnly: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antonioflores.CognitivePacingAtlasWatch
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: FirebaseSDK
        product: FirebaseAuth
